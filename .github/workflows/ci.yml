name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Placeholder values: tests never talk to Firebase.
      EXPO_PUBLIC_FIREBASE_API_KEY: ci
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ci.firebaseapp.com
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ci
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ci.appspot.com
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '0'
      EXPO_PUBLIC_FIREBASE_APP_ID: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The Cloud Functions are a separate project with their own dependencies and tsconfig.
      - run: npm ci --prefix functions
      - run: npm run build --prefix functions
      - run: npm test -- --ci
