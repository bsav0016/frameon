name: Pages
# Publishes the privacy policy, terms and support pages from src/lib/legal.ts to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ['src/lib/legal.ts', 'scripts/build-site.mjs', 'assets/images/logo.png', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/build-site.mjs
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-out
      - id: deployment
        uses: actions/deploy-pages@v4
